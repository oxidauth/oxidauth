[package]
name = "oxidauth-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
flate2 = "1.0.33"
base64 = "0.22.1"
log = "0.4"
console_log = "1.0"
url = { version = "2.5.2", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "v4", "js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
mockall = "0.14.0"
gloo-storage = { version = "0.4.0"}
gloo-timers = { version = "0.3"}
wasm-bindgen-futures = {version = "0.4.71"}
tokio = { version = "1.40.0", features = ["macros", "rt", "time", "sync"] }
wasm-bindgen = "0.2.127"

[features]
mock = []
