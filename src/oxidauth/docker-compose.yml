# Dev compose: mounts the local source into the dev image and shares cargo's
# target directory across all rust services via the project's shared volume
# (declared in the root docker-compose.yml). The production Dockerfiles under
# src/*/build/ are NOT used here - those are for production builds.
#
# Paths are relative to this file's location (src/<stack>/), so the project
# root is ../../ and the env file is ../../.env (RUST_DEV_IMAGE_VERSION,
# DOCKER_PLATFORM). Include this compose from the project root:
#
#   include:
#     - ./src/oxidauth/docker-compose.yml
#
# Routing: nothing publishes a host port. The dev proxy (aka, or any
# dory/nginx-proxy-compatible one) reads VIRTUAL_HOST below and talks to each
# container on its own port 80 (the api binds 0.0.0.0:$PORT=80; nginx and
# `trunk serve` bind 80). The docker network aliases make each container
# answer to that hostname inside the compose network, so the whole dev path
# is http://app.oxidauth.localhost -> http://api.oxidauth.localhost with no
# host ports and no localhost anywhere.

services:
  postgres:
    image: postgres:16
    platform: $DOCKER_PLATFORM
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # init.sh creates the oxidauth db+user; POSTGRES_DB=oxidauth would collide with CREATE DATABASE
      POSTGRES_DB: postgres
      SERVICES: oxidauth
      # raw TCP route for host-side tooling (.env DATABASE_URL, sqlx-cli,
      # psql): aka publishes VIRTUAL_PORT on the host, so
      # postgresql://…@postgres.oxidauth.localhost:5432 just works
      VIRTUAL_HOST: postgres.oxidauth.localhost
      VIRTUAL_PORT: "5432"
      VIRTUAL_PROTO: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ../../devops/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgres.oxidauth.localhost

  oxidauth-api:
    build:
      context: ../..
      dockerfile: devops/docker/oxidauth-dev/Dockerfile
      args:
        RUST_DEV_IMAGE_VERSION: $RUST_DEV_IMAGE_VERSION
    image: oxidauth-dev:local
    working_dir: /home/rust/src/oxidauth
    command: /bin/bash -c 'watchexec -c -e rs -r cargo run --bin oxidauth-api'
    platform: $DOCKER_PLATFORM
    stdin_open: true
    tty: true
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CARGO_TARGET_DIR: /home/rust/shared_target
      # user/db created by init.sh (SERVICES=oxidauth); host-side URLs (.env) go through the postgres virtual host
      DATABASE_URL: postgresql://oxidauth:oxidauth@postgres:5432/oxidauth
      READ_DATABASE_URL: postgresql://oxidauth:oxidauth@postgres:5432/oxidauth
      MIGRATIONS_ENABLED: "true"
      ENVIRONMENT: local
      RUST_LOG: ${RUST_LOG:-INFO}
      VIRTUAL_HOST: api.oxidauth.localhost
    env_file:
      - ../../.env
    volumes:
      - "shared-vol:/home/rust/shared_target"
      - ../../:/home/rust/src/oxidauth:cached
    networks:
      default:
        aliases:
          - api.oxidauth.localhost

  # Dev console: `trunk serve` in-container (Trunk.toml binds 0.0.0.0:80),
  # so the browser loop goes through the proxy too — no host port, no
  # localhost:
  #   docker compose up -d oxidauth-web  ->  http://app.oxidauth.localhost
  # OXIDAUTH_API_URL / OXIDAUTH_CLIENT_KEY are compile-time (option_env!)
  # and are picked up from the environment trunk builds in.
  oxidauth-web:
    build:
      context: ../..
      dockerfile: devops/docker/leptos/Dockerfile
      args:
        TARGETVERSION: $RUST_DEV_IMAGE_VERSION
    image: oxidauth-leptos-dev:local
    working_dir: /home/rust/src/oxidauth/src/oxidauth/oxidauth-web
    command: /bin/bash -c 'trunk serve'
    platform: $DOCKER_PLATFORM
    stdin_open: true
    tty: true
    depends_on:
      - oxidauth-api
    environment:
      CARGO_TARGET_DIR: /home/rust/shared_target
      OXIDAUTH_API_URL: ${OXIDAUTH_WEB_API_URL:-http://api.oxidauth.localhost}
      OXIDAUTH_CLIENT_KEY: ${OXIDAUTH_DEFAULT_CLIENT_KEY:?set in .env}
      VIRTUAL_HOST: app.oxidauth.localhost
    env_file:
      - ../../.env
    volumes:
      - "shared-vol:/home/rust/shared_target"
      - ../../:/home/rust/src/oxidauth:cached
    networks:
      default:
        aliases:
          - app.oxidauth.localhost

  # Production-posture smoke for the admin console, started by name:
  #   docker compose up oxidauth-web-prod
  #   -> http://web.oxidauth.localhost (its own virtual host so it can run
  #   beside the dev trunk service without an aka route collision; builds
  #   the REAL nginx image via build/Dockerfile with the same baked config).
  oxidauth-web-prod:
    build:
      context: ../..
      dockerfile: src/oxidauth/oxidauth-web/build/Dockerfile
      args:
        RUST_BASE_IMAGE_VERSION: $RUST_DEV_IMAGE_VERSION
        OXIDAUTH_API_URL: ${OXIDAUTH_WEB_API_URL:-http://api.oxidauth.localhost}
        OXIDAUTH_CLIENT_KEY: ${OXIDAUTH_DEFAULT_CLIENT_KEY:?set in .env}
    image: oxidauth-web:local
    platform: $DOCKER_PLATFORM
    depends_on:
      - oxidauth-api
    environment:
      VIRTUAL_HOST: web.oxidauth.localhost
    networks:
      default:
        aliases:
          - web.oxidauth.localhost

volumes:
  postgres_data:
