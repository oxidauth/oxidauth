[package]
name = "oxidauth-repository"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0"
description = "repository traits (storage ports) for oxidauth"
homepage = "https://oxidauth.rs"
repository = "https://github.com/oxidauth/oxidauth"
readme = "README.md"

[dependencies]
oxidauth-kernel = { version = "0.9.0", path = "../oxidauth-kernel" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
