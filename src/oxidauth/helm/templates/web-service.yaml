{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "oxidauth.web.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "oxidauth.web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "oxidauth.web.selectorLabels" . | nindent 4 }}
{{- end }}