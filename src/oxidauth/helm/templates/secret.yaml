{{- /*
    Secret half of the api env split (configmap.yaml renders the rest): the
    keys listed by oxidauth.secretEnvKeys that ACTUALLY exist in .Values.env.
    Absent keys are never fabricated here — the chart default ships only
    DATABASE_URL (""), and the pepper only exists once the encrypted env
    values set it. Rendered only when the intersection is non-empty so the
    helm.sh/resource-policy: keep annotation never strands an empty Secret.
*/}}
{{- $secretKeys := fromJson (include "oxidauth.secretEnvKeys" .) }}
{{- $haveSecret := false }}
{{- range $key := keys .Values.env }}{{ if hasKey $secretKeys $key }}{{ $haveSecret = true }}{{ end }}{{ end }}
{{- if $haveSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "oxidauth.fullname" . }}-env
  namespace: {{ .Values.namespace }}
  annotations:
    # survive `helm uninstall` — this holds the DB DSN and (once set) the
    # password pepper; helm must not GC the live pod's backing store
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{- if hasKey $secretKeys $key }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
