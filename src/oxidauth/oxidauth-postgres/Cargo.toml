[package]
name = "oxidauth-postgres"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0"
description = "postgres storage implementation for oxidauth"
homepage = "https://oxidauth.rs"
repository = "https://github.com/oxidauth/oxidauth"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
oxidauth-repository = { version = "0.9.0", path = "../oxidauth-repository" }
oxidauth-kernel = { version = "0.9.0", path = "../oxidauth-kernel" }
postgres = { version = "0.9.0", path = "../../xlib/postgres" }

async-recursion = "1.1.1"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "chrono", "json", "time", "macros", "migrate", "postgres", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
