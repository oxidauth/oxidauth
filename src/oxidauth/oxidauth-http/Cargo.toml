[package]
name = "oxidauth-http"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0"
description = "http DTOs (wire request/response types) for oxidauth"
homepage = "https://oxidauth.rs"
repository = "https://github.com/oxidauth/oxidauth"
readme = "README.md"

# Wire DTOs only: no axum/tokio here — the server lives in oxidauth-api.
[dependencies]
# default-features=false: jwt crypto (jsonwebtoken -> ring) is server-side;
# wire DTOs must stay wasm-linkable (see oxidauth-kernel `[features]`).
oxidauth-kernel = { version = "0.9.0", path = "../oxidauth-kernel", default-features = false }
http = { version = "0.9.0", path = "../../xlib/http" }

chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

# wasm32-unknown-unknown: uuid v4 needs the `js` randomness backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.1", features = ["js"] }
