<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 128 128" width="128" height="128">
  <title>oxidauth — crossbuck favicon (reverse)</title>
  <desc>Reverse favicon for dark grounds: the sign-only crossbuck, rust-stroked boards with ink channel fills (same rust as the primary - the sign never swaps), chevron-cut ends, no letters, no bolts (they painted ground-on-ground at icon sizes).</desc>
  <!-- Geometry (inherited): crossbuck group-local from rx-crossbuck.svg — slot center (123,78); boards 13u wide, tip-to-tip 54u, 41u body between 90-deg chevron apexes, axes at exactly +/-45 deg crossing at 90 deg. "\" board M 142.09 97.09 L 142.09 87.90 L 113.10 58.91 L 103.91 58.91 L 103.91 68.10 L 132.90 97.09 Z; "/" board (drawn last, front) M 142.09 58.91 L 132.90 58.91 L 103.91 87.90 L 103.91 97.09 L 113.10 97.09 L 142.09 68.10 Z. Stroke-8 round-join ink bbox x 99.91..146.09, y 54.91..101.09 = 46.18u square. V5 CHANGE: sign-only mark, viewBox 0 0 128 128 (favicon/app-icon field); no letters, no +7.75 lockup shift; the crossbuck group is centered and scaled ~88u ink via transform="translate(64,64) scale(1.9) translate(-123,-78)" — ink halfwidth 23.09 x 1.9 = 43.87, so stroke ink x/y 20.13..107.87 in both axes = 87.74u, margins ~20.1u all sides; effective stroke 15.2u. Outlined rust #B7410E (the sign is the wordmark's color moment in every variant; only the channel fill swaps to the ink ground) - front-over-back occlusion at the crossing kept. 16px raster check: the chevron X silhouette + hollow channels survive as a recognizable sign (~1.9px effective stroke); the bolt dots do NOT survive. The base's paper bolts r1.6 sit inside the 5u paper channel of the outlined boards (centerline ±2.5u paper, stroke band starts 2.5u off-center), so they are paper-on-paper — invisible at every raster size. FALLBACK adopted + documented: no-bolts — the four <circle> bolts are deleted from this file (render identical, since they painted paper-on-paper); for a crisper <=24px icon consider the v3-style solid boards instead. -->
  <g id="crossbuck" transform="translate(64,64) scale(1.9) translate(-123,-78)" stroke="#B7410E" stroke-width="8" stroke-linejoin="round">
    <path fill="#26262B" d="M 142.09 97.09 L 142.09 87.90 L 113.10 58.91 L 103.91 58.91 L 103.91 68.10 L 132.90 97.09 Z"/>
    <path fill="#26262B" d="M 142.09 58.91 L 132.90 58.91 L 103.91 87.90 L 103.91 97.09 L 113.10 97.09 L 142.09 68.10 Z"/>
  </g>
</svg>
