[package]
name = "oxidauth-kernel"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0"
description = "core lib for oxidauth"
homepage = "https://oxidauth.rs"
repository = "https://github.com/oxidauth/oxidauth"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
oxidauth-permission = { version = "0.9.0", path = "../oxidauth-permission" }

async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.0.33"
jsonwebtoken = "9.3.1"
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# wasm32-unknown-unknown has no OS entropy: uuid's v4 generator rides the `js`
# backend, and getrandom's `js` feature unblocks `rand` on the same target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.26.1", features = ["js"] }
